site_name: Отчеты по средствам Web-программирования
site_description: Лабораторные работы Бородни М. А., группа К3341
site_url: https://100bench.github.io/ITMO_ICT_WebDevelopment_tools_2025-2026/
repo_url: https://github.com/100bench/ITMO_ICT_WebDevelopment_tools_2025-2026
repo_name: 100bench/ITMO_ICT_WebDevelopment_tools_2025-2026

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

nav:
  - Главная: index.md
  - Лабораторная 1: lab1.md
  - Лабораторная 2: lab2.md
  - Лабораторная 3: lab3.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
