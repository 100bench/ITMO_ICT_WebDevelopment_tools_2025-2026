services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab3"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  parser:
    build: .
    command: ["uvicorn", "parser.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lab3
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PARSER_URL: http://parser:8001
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      parser:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["celery", "-A", "worker.celery_app:celery_app", "worker", "--loglevel=info"]
    environment:
      PARSER_URL: http://parser:8001
      REDIS_URL: redis://redis:6379/0
    depends_on:
      parser:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
